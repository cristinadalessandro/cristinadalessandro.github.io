<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cristina D'Alessandro — Portfolio</title>
<meta name="description" content="Portfolio of Cristina D'Alessandro: editorial photography.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=202611232032">
</head>
<body data-page="album">
<div class="wrap">
  <header class="top">
    <a class="brand" id="brand" href="./">Cristina D'Alessandro</a>
    <nav class="nav" id="nav" aria-label="Main menu"></nav>
  </header>

  <main id="album">
    <div class="album-head">
      <a class="back" id="back" href="work.html">← All work</a>
      <h1 class="album-title" id="atitle"></h1>
      <p class="album-desc" id="adesc" hidden></p>
      <div class="album-tools">
        <span class="meta" id="acount"></span>
        <button type="button" class="btn-line" id="share">Share</button>
      </div>
    </div>
    <div id="grid"></div>
  </main>

  <footer class="footer" id="footer"></footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Full-screen photo">
  <div class="lb-bar">
    <span id="lb-count"></span>
    <button type="button" class="lb-btn" id="lb-close">Close ✕</button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">←</button>
    <img id="lb-img" alt="">
    <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next photo">→</button>
  </div>
  <p class="lb-cap" id="lb-cap"></p>
</div>
<script src="assets/site.js?v=202611232032"></script>
</body>
</html>
