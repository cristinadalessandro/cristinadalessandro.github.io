<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cristina D'Alessandro — Fotografia editoriale</title>
<meta name="description" content="Portfolio di Cristina D'Alessandro: fotografia editoriale, ritratti e viaggi.">
<meta property="og:title" content="Cristina D'Alessandro — Fotografia editoriale">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
<div class="wrap">
  <header class="top">
    <a class="brand" id="brand" href="./">Cristina D'Alessandro</a>
    <nav class="nav" id="nav" aria-label="Menu principale"></nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="kicker" id="tagline"></p>
        <h1 class="display" id="name"></h1>
        <p class="intro" id="intro" hidden></p>
      </div>
      <div class="frame" id="hero"></div>
    </section>

    <section aria-labelledby="lavori">
      <div class="section-head">
        <h2 id="lavori">Lavori</h2>
        <span class="meta" id="count"></span>
      </div>
      <div class="album-grid" id="albums"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>
</div>
<script src="assets/site.js"></script>
</body>
</html>
