<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cristina D'Alessandro — Editorial photography</title>
<meta name="description" content="Portfolio of Cristina D'Alessandro: editorial photography, portraits and travel.">
<meta property="og:title" content="Cristina D'Alessandro — Editorial photography">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
<div class="wrap">
  <header class="top">
    <a class="brand" id="brand" href="./">Cristina D'Alessandro</a>
    <nav class="nav" id="nav" aria-label="Main menu"></nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="kicker" id="tagline"></p>
        <h1 class="display" id="name"></h1>
        <p class="intro" id="intro" hidden></p>
      </div>
    </section>

    <section class="selection" aria-label="Selected photos">
      <div class="chips" id="chips" aria-label="Filter photos"></div>
      <div class="mosaic" id="mosaic"></div>
      <p class="empty" id="mosaic-empty" hidden>Photos coming soon.</p>
    </section>

    <section aria-labelledby="lavori">
      <div class="section-head">
        <h2 id="lavori">Work</h2>
        <span class="meta" id="count"></span>
      </div>
      <div class="album-grid" id="albums"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Full-screen photo">
  <div class="lb-bar">
    <span id="lb-count"></span>
    <span class="lb-right">
      <a id="lb-link" href="./" hidden>View collection →</a>
      <button type="button" class="lb-btn" id="lb-close">Close ✕</button>
    </span>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button type="button" class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">←</button>
    <img id="lb-img" alt="">
    <button type="button" class="lb-btn lb-next" id="lb-next" aria-label="Next photo">→</button>
  </div>
  <p class="lb-cap" id="lb-cap"></p>
</div>
<script src="assets/site.js"></script>
</body>
</html>
